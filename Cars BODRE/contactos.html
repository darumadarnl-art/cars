<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - Bodre Cars</title>

    <link rel="stylesheet" href="contactos.css">
</head>

<body>

    <!-- Encabezado de la pagina -->
    <header>
        <h1>Bodre Cars</h1>
        <p>Contáctanos</p>
    </header>


    <!-- Menú de navegación -->
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="carros.html">Carros en Stock</a></li>
            <li><a href="contactos.html">Contacto</a></li>
        </ul>
    </nav>


    <!-- Contenedor principal: Sección de contenido y aside -->
    <div class="contenedor">


        <!-- Sección principal (Lado izquierdo) -->
        <section>

            <h2>Contáctanos</h2>

            <article>

                <h3>Formulario de contacto</h3>

                <p>
                    Si estás interesado en uno de nuestros
                    vehículos, puedes comunicarte con nosotros.
                </p>

                <form action="#" method="post">

                    <label for="nombre">Nombre:</label>
                    <br>

                    <input type="text" id="nombre" name="nombre">

                    <br>
                    <br>


                    <label for="email">Correo electrónico:</label>
                    <br>

                    <input type="email" id="email" name="email">

                    <br>
                    <br>


                    <label for="mensaje">Mensaje:</label>
                    <br>

                    <input type="text" id="mensaje" name="mensaje">

                    <br>
                    <br>


                    <input type="submit" value="Enviar">

                </form>

            </article>

        </section>


        <!-- Aside (Columna lateral) -->
        <aside>

            <h2>Información de contacto</h2>

            <dl>

                <dt>Teléfono</dt>
                <dd>809-000-0000</dd>

                <dt>Correo</dt>
                <dd>carsbodre@gmail.com</dd>

                <dt>Horario</dt>
                <dd>Lunes a sábado</dd>

            </dl>

        </aside>

    </div>

</body>

</html>
